# Publish the built game to GitHub Pages.
#
# The build is deliberately identical to CI's — same commands, same order — so a
# green CI run means a deployable artefact. Everything the game references is a
# relative URL (`base: './'` in the Vite config, `scope: './'` in the manifest),
# so it works from a project subpath without any per-environment configuration.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs an OIDC token to claim the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so the last push to
# land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      # `enablement: true` lets the action turn Pages on itself the first time,
      # using the `pages: write` permission this job already has. Without it the
      # very first deploy of a repository fails on "Get Pages site failed" and
      # waits on somebody finding the right settings page — a one-time manual
      # step is still a step that blocks the deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
