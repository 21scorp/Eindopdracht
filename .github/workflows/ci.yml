name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build

      # The balance harness doubles as an integration test: it plays hundreds of
      # full runs, so a soft-lock or a crash in the simulation fails the build.
      - name: Balance simulation
        run: npm run balance -- --runs 40 --skill average

      - name: Texture manifest
        run: npm run atlas:manifest

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dist
          path: dist
          retention-days: 7

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build

      - name: Serve and drive the game
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          node tools/smoke.mjs
          node tools/viewports.mjs
          node tools/a11y.mjs
          node tools/resilience.mjs
          node tools/offline.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tools/shots
          retention-days: 7
